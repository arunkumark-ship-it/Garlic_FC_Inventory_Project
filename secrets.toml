# .streamlit/secrets.toml
# ─────────────────────────────────────────────────────────────────────────────
# STEP 1: Create a Google Cloud service account and download the JSON key file.
# STEP 2: Share your Google Sheet with the service account email (Editor access).
# STEP 3: Fill in the values below and place this file at .streamlit/secrets.toml
# ─────────────────────────────────────────────────────────────────────────────

[google_sheets]
spreadsheet_name = "Inventory Manager"   # ← Name your Google Sheet exactly this

[gcp_service_account]
type = "service_account"
project_id = "YOUR_PROJECT_ID"
private_key_id = "YOUR_PRIVATE_KEY_ID"
private_key = "-----BEGIN RSA PRIVATE KEY-----\nYOUR_PRIVATE_KEY\n-----END RSA PRIVATE KEY-----\n"
client_email = "your-service-account@your-project.iam.gserviceaccount.com"
client_id = "YOUR_CLIENT_ID"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "https://www.googleapis.com/robot/v1/metadata/x509/your-service-account%40your-project.iam.gserviceaccount.com"
